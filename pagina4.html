<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rockola Cortis</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body class="rockola-body">
    <h1>Canciones</h1>
    <p>Elige tu mood de hoy:</p>

    <!-- Botones de estados de ánimo -->
    <div class="botones-mood">
        <!-- Reemplaza ID_DEL_VIDEO con el código real de YouTube -->
        <button class="mood-btn" data-url="https://www.youtube.com/embed/kRpaqR5sbf0">Enojo</button>
        <button class="mood-btn" data-url="https://www.youtube.com/embed/hOIY3OhvD94">Para llorar a gusto </button>
        <button class="mood-btn" data-url="https://www.youtube.com/embed/U6BDbXIah-Y">Hype total </button>
    </div>

    <!-- Contenedor del video (oculto al principio) -->
    <div class="reproductor-container" id="contenedorVideo">
        <iframe id="reproductor" width="100%" height="315" src="" frameborder="0" allowfullscreen></iframe>
    </div>

    <script src="rockola.js"></script>
</body>
</html>
